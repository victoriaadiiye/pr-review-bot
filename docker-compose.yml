services:
  bot:
    build: .
    env_file: .env
    environment:
      - GITHUB_PRIVATE_KEY_FILE=/app/private-key.pem
    volumes:
      - ${HOST_HOME:-/home/vuifhaolain}/.pr-review-cache:/data/cache
      - ${HOST_HOME:-/home/vuifhaolain}/.claude:/root/.claude:rw
      - ${HOST_HOME:-/home/vuifhaolain}/private-key.pem:/app/private-key.pem:ro
    ports:
      - "${HEALTH_PORT:-8080}:8080"
    restart: unless-stopped
