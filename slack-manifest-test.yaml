_metadata:
  major_version: 1

display_information:
  name: PR Review Bot (Test)
  description: Test instance — single channel only

features:
  bot_user:
    display_name: pr-review-bot-test
    always_online: true

oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - chat:write
      - reactions:read
      - reactions:write
      - im:write
    user:
      - groups:history
      - reactions:read

settings:
  event_subscriptions:
    bot_events:
      - app_mention
    user_events:
      - message.groups
      - reaction_added
  socket_mode_enabled: true
  org_deploy_enabled: false
  token_rotation_enabled: false
