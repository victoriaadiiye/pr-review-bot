version: "3"

vars:
  GO: /usr/local/go/bin/go
  BINARY: pr-review-bot
  TMUX_SESSION: bot
  ROOT_DIR:
    sh: pwd

tasks:
  build:
    desc: Build the binary
    cmds:
      - "{{.GO}} build -o {{.BINARY}} ."

  restart:
    desc: Kill running bot in tmux and restart it
    cmds:
      - tmux kill-session -t {{.TMUX_SESSION}} 2>/dev/null || true
      - tmux new-session -d -s {{.TMUX_SESSION}} -c {{.ROOT_DIR}} "./{{.BINARY}}"

  deploy:
    desc: Pull latest code, build and start via Docker Compose
    cmds:
      - git pull
      - docker compose up -d --build

  redeploy:
    desc: Rebuild from local code and restart via Docker Compose (no git pull)
    cmds:
      - docker compose up -d --build

  kill:
    desc: Stop the bot container
    cmds:
      - docker compose down

  logs:
    desc: Tail live bot output from Docker
    cmds:
      - docker compose logs -f

  status:
    desc: Show container status
    cmds:
      - docker compose ps
      - 'curl -s http://localhost:${HEALTH_PORT:-8080}/metrics | python3 -m json.tool 2>/dev/null || echo "container not responding"'

  post:
    desc: Post a review request to the running container
    cmds:
      - './{{.BINARY}} post {{.CLI_ARGS}}'

  post-remote:
    desc: Post a review request to a remote container (task post-remote -- <host:port> <pr-url> [flags])
    cmds:
      - './{{.BINARY}} post --host {{.CLI_ARGS}}'

  deploy-legacy:
    desc: "Legacy: Pull, rebuild, restart in tmux (no Docker)"
    cmds:
      - git pull
      - "{{.GO}} build -o {{.BINARY}} ."
      - tmux kill-session -t {{.TMUX_SESSION}} 2>/dev/null || true
      - tmux new-session -d -s {{.TMUX_SESSION}} -c {{.ROOT_DIR}} "./{{.BINARY}}"
